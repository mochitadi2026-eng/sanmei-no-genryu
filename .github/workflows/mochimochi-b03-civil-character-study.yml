name: Mochimochi B03 civil-date character policy candidate

on:
  push:
    paths:
      - 'projects/mochimochi-jutsu/b03-civil-date-character-candidate-v0.1.mjs'
      - 'projects/mochimochi-jutsu/tests/b03-civil-date-character-candidate.test.mjs'
      - 'projects/mochimochi-jutsu/b01-day-cycle-and-character-study-v0.1.mjs'
      - 'projects/mochimochi-jutsu/m02-core-symbols-v0.1.json'
      - '.github/workflows/mochimochi-b03-civil-character-study.yml'
  pull_request:
    paths:
      - 'projects/mochimochi-jutsu/b03-civil-date-character-candidate-v0.1.mjs'
      - 'projects/mochimochi-jutsu/tests/b03-civil-date-character-candidate.test.mjs'
      - 'projects/mochimochi-jutsu/b01-day-cycle-and-character-study-v0.1.mjs'
      - 'projects/mochimochi-jutsu/m02-core-symbols-v0.1.json'
      - '.github/workflows/mochimochi-b03-civil-character-study.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b03:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check projects/mochimochi-jutsu/b03-civil-date-character-candidate-v0.1.mjs
          node --check projects/mochimochi-jutsu/tests/b03-civil-date-character-candidate.test.mjs
      - name: Verify 12-by-5 date-only rule is deterministic and not a natal claim
        run: node --test projects/mochimochi-jutsu/tests/b03-civil-date-character-candidate.test.mjs
