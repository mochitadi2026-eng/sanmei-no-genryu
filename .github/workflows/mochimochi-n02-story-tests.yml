name: Mochimochi N02 synthetic story anchor tests

on:
  push:
    paths:
      - 'projects/mochimochi-jutsu/n02-story-anchor-selector-v0.1.mjs'
      - 'projects/mochimochi-jutsu/tests/n02-story-anchor-selector.test.mjs'
      - '.github/workflows/mochimochi-n02-story-tests.yml'
  pull_request:
    paths:
      - 'projects/mochimochi-jutsu/n02-story-anchor-selector-v0.1.mjs'
      - 'projects/mochimochi-jutsu/tests/n02-story-anchor-selector.test.mjs'
      - '.github/workflows/mochimochi-n02-story-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check projects/mochimochi-jutsu/n02-story-anchor-selector-v0.1.mjs
          node --check projects/mochimochi-jutsu/tests/n02-story-anchor-selector.test.mjs
      - name: Test synthetic-only timeline ranking and release guard
        run: node --test projects/mochimochi-jutsu/tests/n02-story-anchor-selector.test.mjs
