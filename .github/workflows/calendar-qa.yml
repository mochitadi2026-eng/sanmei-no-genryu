name: Calendar boundary QA fixture

on:
  pull_request:
    paths:
      - 'qa/**'
      - '.github/workflows/calendar-qa.yml'
  push:
    paths:
      - 'qa/**'
      - '.github/workflows/calendar-qa.yml'

permissions:
  contents: read

jobs:
  reference-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check (does not execute engine)
        run: node --check qa/check-pillar-engine.mjs
      - name: Validate 24 terms and 48 cases (fixture only)
        run: node qa/check-pillar-engine.mjs --verify-fixture
      - name: Confirm missing engine is NOT counted as success
        shell: bash
        run: |
          set +e
          node qa/check-pillar-engine.mjs
          code=$?
          if [ "$code" -ne 2 ]; then
            echo "Expected exit 2 (engine not tested), got $code" >&2
            exit 1
          fi

      - name: Confirm wrong engine answer fails (negative control)
        shell: bash
        run: |
          cat > qa/_intentionally-wrong-adapter.mjs <<'EOF'
          export async function resolvePillars() {
            return {status: 'ok', yearPillar: '甲子', monthPillar: '甲子'};
          }
          EOF
          set +e
          node qa/check-pillar-engine.mjs --adapter ./qa/_intentionally-wrong-adapter.mjs >/dev/null 2>&1
          code=$?
          rm qa/_intentionally-wrong-adapter.mjs
          if [ "$code" -ne 1 ]; then
            echo "Expected exit 1 for intentionally wrong results, got $code" >&2
            exit 1
          fi
