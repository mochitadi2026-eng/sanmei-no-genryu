name: Research site consistency

on:
  push:
    paths:
      - 'articles/**'
      - 'docs/**'
      - 'research/**'
      - 'sources/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/research-validation.yml'
  pull_request:
    paths:
      - 'articles/**'
      - 'docs/**'
      - 'research/**'
      - 'sources/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/research-validation.yml'

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install site renderer
        run: python -m pip install -r requirements.txt
      - name: Validate committed Markdown and HTML
        run: python scripts/validate_research.py
      - name: Run negative regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Regenerate HTML and validate links
        run: |
          python scripts/build_site.py
          python scripts/validate_research.py
      - name: Reject stale committed HTML
        run: |
          git diff --exit-code -- docs/
