name: Mochimochi M08 classifier verification

on:
  push:
    paths:
      - 'projects/mochimochi-jutsu/m08-classifier-v0.1.mjs'
      - 'projects/mochimochi-jutsu/m07-question-bank-v0.1.json'
      - 'projects/mochimochi-jutsu/m04-types-phases-v0.1.json'
      - 'projects/mochimochi-jutsu/tests/m08-classifier.test.mjs'
      - '.github/workflows/mochimochi-m08-tests.yml'
  pull_request:
    paths:
      - 'projects/mochimochi-jutsu/m08-classifier-v0.1.mjs'
      - 'projects/mochimochi-jutsu/m07-question-bank-v0.1.json'
      - 'projects/mochimochi-jutsu/m04-types-phases-v0.1.json'
      - 'projects/mochimochi-jutsu/tests/m08-classifier.test.mjs'
      - '.github/workflows/mochimochi-m08-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-classifier:
    name: Test deterministic M08 questionnaire (dev only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and test syntax
        run: |
          node --check projects/mochimochi-jutsu/m08-classifier-v0.1.mjs
          node --check projects/mochimochi-jutsu/tests/m08-classifier.test.mjs
      - name: Run Node tests including exhaustive 6,174 combinations
        run: node --test projects/mochimochi-jutsu/tests/m08-classifier.test.mjs
