name: Synchronize generated site HTML

on:
  push:
    paths:
      - '.github/workflows/sync-generated-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build generated HTML
        run: python scripts/build_site.py
      - name: Verify generated site
        run: |
          python scripts/validate_research.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit generated HTML if changed
        run: |
          if ! git diff --quiet -- docs/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/
            git commit -m "chore: synchronize published HTML from Markdown"
            git push origin HEAD:main
          else
            echo "Generated HTML already matches committed files."
          fi
          git diff --exit-code -- docs/
