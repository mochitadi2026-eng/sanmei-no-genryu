<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
<title id="title">木漏れ日の小道</title>
<desc id="desc">分かれ道の道しるべ、手前の一歩目の飛び石、木陰のベンチ、遠くまで続く小道、小さな風鈴、二人で囲める丸テーブルがある穏やかな和風の庭。</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7f3e9"/><stop offset=".63" stop-color="#edf0e4"/><stop offset="1" stop-color="#e3e9d8"/></linearGradient>
  <linearGradient id="soil" x1="0" x2=".35" y1="0" y2="1"><stop stop-color="#d3c2a7"/><stop offset="1" stop-color="#ead9b9"/></linearGradient>
  <linearGradient id="wood" x1="0" x2="1"><stop stop-color="#9c7356"/><stop offset=".5" stop-color="#b28a64"/><stop offset="1" stop-color="#84674f"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#fff8e5" stop-opacity=".7"/><stop offset="1" stop-color="#fff8e5" stop-opacity="0"/></radialGradient>
  <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M3 8l5-1M14 21l5 1M21 3l2 3" stroke="#8f9b80" stroke-opacity=".09" stroke-width="1" fill="none"/></pattern>
  <g id="leaf"><path d="M0 0 Q7 -10 16 -5Q12 7 0 0Z" fill="#85a48a" stroke="#748e74" stroke-width="1"/></g>
  <g id="blossom"><circle cx="-8" cy="0" r="6" fill="#efc9c7"/><circle cx="8" cy="0" r="6" fill="#efd6cc"/><circle cx="0" cy="-8" r="6" fill="#f4dcd6"/><circle cx="0" cy="8" r="6" fill="#eecbc5"/><circle r="3" fill="#d7ae75"/></g>
</defs>
